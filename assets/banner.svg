<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="MIMIC — reverse-engineer any website">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141416"/><stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".33" stop-color="#a7d774"/>
      <stop offset=".55" stop-color="#f7d24a"/><stop offset=".78" stop-color="#e0744d"/>
      <stop offset="1" stop-color="#c77dff"/>
    </linearGradient>
    <linearGradient id="panelR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1f26"/><stop offset="1" stop-color="#12141a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="440" fill="url(#bg)"/>
  <!-- faint measurement grid: the "reverse-engineering" motif -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 110H1200M0 220H1200M0 330H1200"/>
    <path d="M120 0V440M300 0V440M480 0V440M720 0V440M900 0V440M1080 0V440"/>
  </g>

  <!-- glow -->
  <ellipse cx="880" cy="230" rx="240" ry="150" fill="url(#spectrum)" opacity="0.16" filter="url(#soft)"/>

  <!-- reference panel (left, "source") + mirrored reconstruction (right) -->
  <g transform="translate(690,96)">
    <rect x="0" y="0" width="230" height="250" rx="16" fill="url(#panelR)" stroke="#2a2e37"/>
    <g fill="#3a3f4b"><circle cx="20" cy="22" r="4"/><circle cx="36" cy="22" r="4"/><circle cx="52" cy="22" r="4"/></g>
    <rect x="20" y="46" width="120" height="14" rx="7" fill="#5b6270"/>
    <rect x="20" y="72" width="190" height="10" rx="5" fill="#343a45"/>
    <rect x="20" y="92" width="160" height="10" rx="5" fill="#2e333d"/>
    <rect x="20" y="126" width="90" height="70" rx="10" fill="#f7d24a"/>
    <rect x="120" y="126" width="90" height="70" rx="10" fill="#e0744d"/>
    <rect x="20" y="208" width="190" height="24" rx="12" fill="url(#spectrum)" opacity="0.9"/>
  </g>
  <!-- mirror seam -->
  <g transform="translate(958,96)" opacity="0.55">
    <rect x="0" y="0" width="150" height="250" rx="16" fill="none" stroke="url(#spectrum)" stroke-dasharray="4 7"/>
    <rect x="16" y="46" width="80" height="14" rx="7" fill="#4a5060"/>
    <rect x="16" y="126" width="60" height="70" rx="10" fill="#a7d774" opacity="0.85"/>
    <rect x="86" y="126" width="48" height="70" rx="10" fill="#93aed1" opacity="0.85"/>
  </g>

  <!-- wordmark -->
  <text x="96" y="196" font-family="'DM Sans',Segoe UI,Arial,sans-serif" font-size="118" font-weight="800" letter-spacing="-6" fill="#fafafa">mimic</text>
  <rect x="100" y="214" width="118" height="8" rx="4" fill="url(#spectrum)"/>
  <text x="100" y="262" font-family="'DM Sans',Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" letter-spacing="-0.5" fill="#c9ccd3">Reverse-engineer any website — pixel, motion &amp; 3D.</text>
  <text x="100" y="298" font-family="'DM Mono',ui-monospace,monospace" font-size="15" letter-spacing="1" fill="#7f8794">OBSERVE · MEASURE · REBUILD · VERIFY</text>

  <!-- chips -->
  <g font-family="'DM Mono',ui-monospace,monospace" font-size="14" fill="#0b0b0d">
    <g transform="translate(100,340)"><rect width="150" height="34" rx="17" fill="#f7d24a"/><text x="18" y="22">Claude Code skill</text></g>
    <g transform="translate(262,340)"><rect width="128" height="34" rx="17" fill="#a7d774"/><text x="16" y="22">Playwright</text></g>
    <g transform="translate(402,340)"><rect width="150" height="34" rx="17" fill="#93aed1"/><text x="16" y="22">TDD-verified</text></g>
  </g>
</svg>
